services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: design-platform-postgres
    environment:
      POSTGRES_USER: surojit
      # Must match the password this volume was first initialized with:
      # POSTGRES_PASSWORD only takes effect on first init of the data dir.
      POSTGRES_PASSWORD: design_password
      POSTGRES_DB: grpx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host ports are offset: a host-level PostgreSQL (systemd) already
      # owns 5432 on this machine. Containers reach this service as
      # `postgres:5432` on the internal network; 5433 is only for host
      # tools that want the containerized DB.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surojit -d grpx"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: design-platform-redis
    ports:
      # Offset for the same reason as postgres: a host-level redis-server
      # (systemd) already owns 127.0.0.1:6379. Containers reach this
      # service as `redis:6379` on the internal network.
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend API
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: design-platform-api
    # The image WORKDIR is /app/api — run from there directly.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DATABASE_URL=postgresql://surojit:design_password@postgres:5432/grpx
      # settings.py reads DB_* (not DATABASE_URL). DB_HOST must be the
      # compose service name (`postgres`). Inside a container, `localhost`
      # is the container itself, not the host or the postgres service, so
      # it yields "Connection refused".
      - DB_HOST=postgres
      - DB_PASSWORD=design_password
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,api
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/api
      - ./packages/design-schema:/app/design-schema

  # Celery Worker for async tasks
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: design-platform-worker
    # The image WORKDIR is /app/api — run from there directly.
    command: >
      sh -c "celery -A config worker -l info"
    environment:
      - DATABASE_URL=postgresql://surojit:design_password@postgres:5432/grpx
      - DB_HOST=postgres
      - DB_PASSWORD=design_password
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - postgres
      - redis
      - api
    volumes:
      - ./apps/api:/app/api
      - ./packages/design-schema:/app/design-schema

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: design-platform-web
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NODE_ENV=development
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: design-platform-network
